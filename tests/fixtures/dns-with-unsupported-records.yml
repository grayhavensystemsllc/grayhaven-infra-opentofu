---
ttl: 300

domains:
  primary_site:
    name: example.com
    environment:
      apex: true
      web_aliases: true
    records:
      unsupported_mx:
        type: MX
        name: "@"
        value: mail.example.com.
        priority: 10
    protected_records:
      unsupported_srv:
        type: SRV
        name: _service._tcp
        value: service.example.com.
