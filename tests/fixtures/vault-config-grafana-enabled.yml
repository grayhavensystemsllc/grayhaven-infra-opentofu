---
certificate:
  environment: production
  email: admin@example.com
network:
  vpc_cidr: 172.22.0.0/16
discord_webhook: production

observability:
  grafana_cloud:
    enabled: true
    logs_enabled: true

backup:
  repositories:
    local:
      repository_path: /var/backups/restic
      homedir_archive_path: /var/backups/deleted-homedir-archives
  schedule: daily
  retention:
    keep_daily: 7
  include:
    - /home
    - /var/log
  exclude: []
