---
ttl: 300

domains:
  primary_site:
    name: example.com
    environment:
      apex: true
      web_aliases: true
    records:
      infrastructure_notice_a:
        type: A
        name: infra
        value: 192.0.2.10
      infrastructure_notice_cname:
        type: CNAME
        name: notice
        value: infra.example.com.
      infrastructure_notice_txt:
        type: TXT
        name: _infrastructure
        value: "Example infrastructure DNS"
    protected_records:
      protected_a:
        type: A
        name: protected
        value: 192.0.2.20
      protected_cname:
        type: CNAME
        name: protected-notice
        value: protected.example.com.
      protected_txt:
        type: TXT
        name: _protected
        value: "protected=true"

  secondary_site:
    name: example.net
    environment:
      apex: true
      web_aliases: true
