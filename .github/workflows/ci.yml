name: CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    env:
      TF_VAR_state_encryption_passphrase_baseline: offline-test-baseline-state-passphrase
      TF_VAR_state_encryption_passphrase_staging: offline-test-staging-state-passphrase
      TF_VAR_state_encryption_passphrase_prod: offline-test-prod-state-passphrase

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2

      - name: Run actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4  # v0.1.12

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca  # master
        with:
          version: v0.11.0
          additional_files: scripts/read-vault-config

      - name: Check OpenTofu formatting
        run: tofu fmt -check -recursive

      - name: Test vault configuration reader
        run: |
          python3 -m pip install --requirement requirements-dev.txt
          python3 -m coverage run tests/test_read_vault_config.py
          python3 -m coverage report

      - name: Initialize OpenTofu
        run: tofu init -backend=false

      - name: Validate OpenTofu configuration
        run: tofu validate

      - name: Run yamllint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c  # v3

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: |
            **/*.md
            !.terraform/**
